<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Capacity — This Week &amp; Next</title>
<style>
  :root {
    --cap-1: #d4334a;
    --cap-2: #e06830;
    --cap-3: #e89b3a;
    --cap-4: #3db8a0;
    --cap-5: #1aa88a;

    --cap-1-bg: rgba(212, 51, 74, 0.12);
    --cap-2-bg: rgba(224, 104, 48, 0.10);
    --cap-3-bg: rgba(232, 155, 58, 0.10);
    --cap-4-bg: rgba(61, 184, 160, 0.10);
    --cap-5-bg: rgba(26, 168, 138, 0.12);

    --bg: transparent;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-muted: #6b7280;
    --border: rgba(0,0,0,0.08);
    --ring: rgba(26,26,46,0.55);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { background: var(--bg); }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: var(--text);
    padding: 16px;
    min-width: 280px;
  }

  .week-section { margin-bottom: 18px; }

  .week-label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text-muted);
    margin-bottom: 10px;
    padding-left: 2px;
  }

  .week-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-height: 160px;
    position: relative;
    overflow: hidden;
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    border-radius: 10px;
    pointer-events: none;
  }

  .card[data-cap="1"]::before { background: var(--cap-1-bg); }
  .card[data-cap="2"]::before { background: var(--cap-2-bg); }
  .card[data-cap="3"]::before { background: var(--cap-3-bg); }
  .card[data-cap="4"]::before { background: var(--cap-4-bg); }
  .card[data-cap="5"]::before { background: var(--cap-5-bg); }

  .card[data-cap="1"] { border-color: rgba(212, 51, 74, 0.25); }
  .card[data-cap="2"] { border-color: rgba(224, 104, 48, 0.25); }
  .card[data-cap="3"] { border-color: rgba(232, 155, 58, 0.25); }
  .card[data-cap="4"] { border-color: rgba(61, 184, 160, 0.25); }
  .card[data-cap="5"] { border-color: rgba(26, 168, 138, 0.25); }

  .card.today { box-shadow: 0 0 0 2px var(--ring); }

  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    position: relative;
    z-index: 1;
  }

  .day-info { display: flex; flex-direction: column; }

  .day-name {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.3px;
  }

  .day-date {
    font-size: 10px;
    color: var(--text-muted);
    margin-top: 1px;
  }

  .cap-badge {
    font-size: 12px;
    font-weight: 800;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    line-height: 1;
  }

  .card[data-cap="1"] .cap-badge { background: var(--cap-1); color: #fff; }
  .card[data-cap="2"] .cap-badge { background: var(--cap-2); color: #fff; }
  .card[data-cap="3"] .cap-badge { background: var(--cap-3); color: #fff; }
  .card[data-cap="4"] .cap-badge { background: var(--cap-4); color: #fff; }
  .card[data-cap="5"] .cap-badge { background: var(--cap-5); color: #fff; }

  .focus-blocks {
    display: flex;
    flex-direction: column;
    gap: 4px;
    flex: 1;
    position: relative;
    z-index: 1;
  }

  .focus-block { display: flex; align-items: flex-start; gap: 6px; }

  .focus-label {
    font-size: 8px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-muted);
    min-width: 18px;
    padding-top: 1px;
    flex-shrink: 0;
  }

  .focus-text {
    font-size: 11px;
    line-height: 1.35;
    color: var(--text);
    word-break: break-word;
  }

  .commitments {
    display: flex;
    flex-wrap: wrap;
    gap: 3px;
    position: relative;
    z-index: 1;
    margin-top: auto;
  }

  .tag {
    font-size: 8px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 2px 6px;
    border-radius: 4px;
    background: rgba(0,0,0,0.06);
    color: var(--text-muted);
  }

  .card.empty { opacity: 0.3; min-height: 120px; }
  .card.empty .day-name { color: var(--text-muted); }

  .empty-label {
    font-size: 10px;
    color: var(--text-muted);
    font-style: italic;
    position: relative;
    z-index: 1;
  }

  .generated-at {
    font-size: 9px;
    color: var(--text-muted);
    text-align: right;
    margin-top: 8px;
    letter-spacing: 0.3px;
  }

  .notice {
    font-size: 12px;
    line-height: 1.5;
    color: var(--text-muted);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
  }
  .notice strong { color: var(--text); display: block; margin-bottom: 4px; font-size: 13px; }
  .notice code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11px;
    background: rgba(0,0,0,0.06);
    padding: 1px 4px;
    border-radius: 3px;
  }

  /* ── Notion embeds are fixed-height iframes. Compact as height shrinks. ── */
  @media (max-height: 620px) {
    body { padding: 12px; }
    .card { min-height: 132px; }
    .week-section { margin-bottom: 14px; }
  }
  @media (max-height: 520px) {
    body { padding: 10px; }
    .card { min-height: 108px; padding: 9px; gap: 6px; }
    .card.empty { min-height: 88px; }
    .week-label { margin-bottom: 7px; font-size: 10px; }
    .week-section { margin-bottom: 11px; }
    .focus-text { font-size: 10px; }
    .cap-badge { width: 20px; height: 20px; font-size: 11px; }
  }
  @media (max-height: 420px) {
    .card { min-height: 92px; padding: 8px; }
    .day-name { font-size: 12px; }
    .commitments { display: none; }
    .generated-at { display: none; }
  }

  @media (max-width: 600px) { .week-grid { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 400px) { .week-grid { grid-template-columns: 1fr; } }

  /* Dark mode via system preference */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --cap-1-bg: rgba(212, 51, 74, 0.35);
      --cap-2-bg: rgba(224, 104, 48, 0.30);
      --cap-3-bg: rgba(232, 155, 58, 0.28);
      --cap-4-bg: rgba(61, 184, 160, 0.28);
      --cap-5-bg: rgba(26, 168, 138, 0.32);
      --surface: #16213e;
      --text: #e0e0e0;
      --text-muted: #8892a4;
      --border: rgba(255,255,255,0.06);
      --ring: rgba(224,224,224,0.5);
    }
    :root:not([data-theme="light"]) .card[data-cap="1"] { border-color: rgba(212, 51, 74, 0.3); }
    :root:not([data-theme="light"]) .card[data-cap="2"] { border-color: rgba(224, 104, 48, 0.3); }
    :root:not([data-theme="light"]) .card[data-cap="3"] { border-color: rgba(232, 155, 58, 0.3); }
    :root:not([data-theme="light"]) .card[data-cap="4"] { border-color: rgba(61, 184, 160, 0.3); }
    :root:not([data-theme="light"]) .card[data-cap="5"] { border-color: rgba(26, 168, 138, 0.3); }
    :root:not([data-theme="light"]) .tag { background: rgba(255,255,255,0.07); }
    :root:not([data-theme="light"]) .notice code { background: rgba(255,255,255,0.09); }
  }

  /* Force dark via URL param ?theme=dark */
  :root[data-theme="dark"] {
    --cap-1-bg: rgba(212, 51, 74, 0.35);
    --cap-2-bg: rgba(224, 104, 48, 0.30);
    --cap-3-bg: rgba(232, 155, 58, 0.28);
    --cap-4-bg: rgba(61, 184, 160, 0.28);
    --cap-5-bg: rgba(26, 168, 138, 0.32);
    --surface: #16213e;
    --text: #e0e0e0;
    --text-muted: #8892a4;
    --border: rgba(255,255,255,0.06);
    --ring: rgba(224,224,224,0.5);
  }
  :root[data-theme="dark"] .card[data-cap="1"] { border-color: rgba(212, 51, 74, 0.3); }
  :root[data-theme="dark"] .card[data-cap="2"] { border-color: rgba(224, 104, 48, 0.3); }
  :root[data-theme="dark"] .card[data-cap="3"] { border-color: rgba(232, 155, 58, 0.3); }
  :root[data-theme="dark"] .card[data-cap="4"] { border-color: rgba(61, 184, 160, 0.3); }
  :root[data-theme="dark"] .card[data-cap="5"] { border-color: rgba(26, 168, 138, 0.3); }
  :root[data-theme="dark"] .tag { background: rgba(255,255,255,0.07); }
  :root[data-theme="dark"] .notice code { background: rgba(255,255,255,0.09); }
</style>
</head>
<body>

<!--
  CAPACITY DASHBOARD — static page, no build step.
  Data lives in data.json next to this file. Edit it with admin.html,
  then commit the updated data.json. This page fetches it at load time.

  Repo: https://github.com/Dartanyon-hub/capacity-dashboard
  Live: https://dartanyon-hub.github.io/capacity-dashboard/
-->

<script>
var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function formatDate(iso) {
  var d = new Date(iso + 'T12:00:00');
  return MONTHS[d.getMonth()] + ' ' + d.getDate();
}

function weekRange(start, end) {
  var s = new Date(start + 'T12:00:00');
  var e = new Date(end + 'T12:00:00');
  if (s.getMonth() === e.getMonth()) return MONTHS[s.getMonth()] + ' ' + s.getDate() + ' – ' + e.getDate();
  return MONTHS[s.getMonth()] + ' ' + s.getDate() + ' – ' + MONTHS[e.getMonth()] + ' ' + e.getDate();
}

function todayISO() {
  var d = new Date();
  return d.getFullYear() + '-' +
    String(d.getMonth() + 1).padStart(2, '0') + '-' +
    String(d.getDate()).padStart(2, '0');
}

function card(d, today) {
  var cap = d.cap || 0;
  var empty = !d.am && !d.pm && !cap;
  var cls = 'card' + (empty ? ' empty' : '') + (d.date === today ? ' today' : '');
  var h = '<div class="' + cls + '"' + (cap ? ' data-cap="' + cap + '"' : '') + '>';
  h += '<div class="card-header"><div class="day-info">';
  h += '<span class="day-name">' + esc(d.day) + '</span>';
  h += '<span class="day-date">' + esc(formatDate(d.date)) + '</span>';
  h += '</div>';
  if (cap) h += '<span class="cap-badge">' + cap + '</span>';
  h += '</div>';
  if (empty) {
    h += '<span class="empty-label">Not yet planned</span>';
  } else {
    h += '<div class="focus-blocks">';
    h += '<div class="focus-block"><span class="focus-label">AM</span><span class="focus-text">' + (d.am ? esc(d.am) : '—') + '</span></div>';
    h += '<div class="focus-block"><span class="focus-label">PM</span><span class="focus-text">' + (d.pm ? esc(d.pm) : '—') + '</span></div>';
    h += '</div>';
    if (d.commitments && d.commitments.length) {
      h += '<div class="commitments">';
      d.commitments.forEach(function (c) { h += '<span class="tag">' + esc(c) + '</span>'; });
      h += '</div>';
    }
  }
  h += '</div>';
  return h;
}

function renderDashboard(days, generatedAt) {
  var today = todayISO();
  var w1 = days.slice(0, 5);
  var w2 = days.slice(5, 10);
  var o = '';

  if (w1.length) {
    o += '<div class="week-section">';
    o += '<div class="week-label">This Week — ' + esc(weekRange(w1[0].date, w1[w1.length - 1].date)) + '</div>';
    o += '<div class="week-grid">';
    w1.forEach(function (d) { o += card(d, today); });
    o += '</div></div>';
  }

  if (w2.length) {
    o += '<div class="week-section">';
    o += '<div class="week-label">Next Week — ' + esc(weekRange(w2[0].date, w2[w2.length - 1].date)) + '</div>';
    o += '<div class="week-grid">';
    w2.forEach(function (d) { o += card(d, today); });
    o += '</div></div>';
  }

  if (generatedAt) o += '<div class="generated-at">Last updated: ' + esc(generatedAt) + '</div>';
  return o;
}

// ── Theme: URL param overrides system preference ──
(function applyTheme() {
  var forced = new URLSearchParams(window.location.search).get('theme');
  if (forced === 'dark' || forced === 'light') {
    document.documentElement.setAttribute('data-theme', forced);
  }
})();

// ── Preview channel ──
// admin.html embeds this page and pushes in-progress edits so the
// preview is the real renderer, not a copy that can drift. Values are
// escaped in card(), and this only ever affects the current viewer.
var previewMode = false;
window.addEventListener('message', function (ev) {
  var msg = ev.data;
  if (!msg || msg.type !== 'capacity-preview' || !msg.payload) return;
  previewMode = true;
  document.body.innerHTML = renderDashboard(msg.payload.days || [], msg.payload.generatedAt);
});

// ── Load data.json and render ──
(function load() {
  fetch('data.json?t=' + Date.now(), { cache: 'no-store' })
    .then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function (payload) {
      if (previewMode) return; // a preview payload already won the race
      var days = Array.isArray(payload) ? payload : (payload.days || []);
      if (!days.length) throw new Error('no days found in data.json');
      document.body.innerHTML = renderDashboard(days, payload.generatedAt);
    })
    .catch(function (err) {
      if (previewMode) return;
      var isLocal = window.location.protocol === 'file:';
      document.body.innerHTML =
        '<div class="notice"><strong>Couldn\'t load capacity data</strong>' +
        (isLocal
          ? 'This page was opened straight from disk, so the browser blocks reading <code>data.json</code>. Run <code>python3 -m http.server</code> in this folder and open <code>localhost:8000</code>, or just use the published GitHub Pages URL.'
          : 'Could not fetch <code>data.json</code> (' + esc(err.message) + '). Check that the file sits next to this page and contains valid JSON.') +
        '</div>';
    });
})();
</script>

</body>
</html>
